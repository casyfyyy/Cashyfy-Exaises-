<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CashyFy Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f7f1e3; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:#fffdf7; border-radius:28px; padding:36px 28px; max-width:400px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,0.12); border-top:4px solid #1c1c1c; }
.logo-wrap { display:flex; justify-content:center; margin-bottom:24px; }
.logo-outer { width:72px; height:72px; border-radius:50%; background:#f0e4c4; display:flex; align-items:center; justify-content:center; }
.logo-inner { width:52px; height:52px; border-radius:14px; overflow:hidden; }
.logo-inner img { width:100%; height:100%; object-fit:cover; }
.title { font-family:'Poppins',sans-serif; font-size:24px; font-weight:800; color:#1a1a1a; text-align:center; margin-bottom:6px; }
.subtitle { font-size:14px; color:#9a9184; text-align:center; margin-bottom:28px; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13px; font-weight:700; color:#1a1a1a; margin-bottom:8px; }
.input-wrap { position:relative; }
.input-wrap input { width:100%; padding:14px 18px; border:2px solid #ece3cc; border-radius:14px; font-size:15px; font-family:'Inter',sans-serif; font-weight:600; color:#1a1a1a; outline:none; background:#fbf7ec; transition:border-color 0.2s; }
.input-wrap input:focus { border-color:#1c1c1c; background:#fff; }
.input-wrap input::placeholder { color:#bbb; font-weight:500; }
.eye-btn { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9a9184; font-size:16px; }
.forgot-link { text-align:right; margin-top:8px; }
.forgot-link a { font-size:13px; color:#1c1c1c; font-weight:700; text-decoration:none; border-bottom:1px solid #ece3cc; }
.submit-btn { width:100%; padding:16px; background:linear-gradient(135deg,#1c1c1c,#3a3a3a); color:#fdf6e3; border:none; border-radius:14px; font-size:16px; font-weight:800; font-family:'Poppins',sans-serif; cursor:pointer; letter-spacing:1px; transition:all 0.2s; box-shadow:0 4px 16px rgba(0,0,0,0.3); margin-top:8px; }
.submit-btn:hover { transform:translateY(-2px); }
.submit-btn:disabled { opacity:0.7; cursor:not-allowed; transform:none; }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
.divider span { flex:1; height:1px; background:#ece3cc; }
.divider p { font-size:13px; color:#9a9184; font-weight:600; }
.register-link { text-align:center; font-size:14px; color:#9a9184; }
.register-link a { color:#1c1c1c; font-weight:800; text-decoration:none; border-bottom:1px solid #1c1c1c; }
.error-msg { background:#fff0f0; border:1px solid #ffcccc; border-radius:10px; padding:10px 14px; font-size:13px; color:#e53935; font-weight:600; margin-bottom:16px; display:none; }
.powered { text-align:center; margin-top:20px; font-size:12px; color:#bbb; font-weight:700; }
.powered span { color:#1c1c1c; }
.toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-16px); background:#fffdf7; color:#1a1a1a; padding:12px 22px 12px 12px; border-radius:50px; font-size:14px; font-weight:800; z-index:10000; opacity:0; visibility:hidden; transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 12px 30px -6px rgba(0,0,0,0.2); font-family:'Inter',sans-serif; display:flex; align-items:center; gap:10px; white-space:nowrap; border:1px solid #ece3cc; }
.toast.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
.toast-icon { width:24px; height:24px; border-radius:50%; background:#1c1c1c; color:#fdf6e3; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }

/* Forgot Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:#fffdf7; border-radius:24px; padding:28px; max-width:360px; width:100%; box-shadow:0 24px 64px rgba(0,0,0,0.3); }
.modal-title { font-family:'Poppins',sans-serif; font-size:20px; font-weight:800; color:#1a1a1a; margin-bottom:8px; }
.modal-sub { font-size:14px; color:#9a9184; margin-bottom:20px; }
.modal-btn { width:100%; padding:14px; background:linear-gradient(135deg,#1c1c1c,#3a3a3a); color:#fdf6e3; border:none; border-radius:12px; font-size:15px; font-weight:800; font-family:'Poppins',sans-serif; cursor:pointer; margin-top:8px; }
.modal-cancel { width:100%; padding:12px; background:transparent; color:#9a9184; border:none; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-outer">
      <div class="logo-inner">
        <img src="https://i.ibb.co/gZFrdcN9/istockphoto-1412043856-1024x1024.jpg">
      </div>
    </div>
  </div>
  <div class="title">Welcome Back ⚡</div>
  <div class="subtitle">Sign in to your CashyFy wallet</div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label>Phone Number</label>
    <div class="input-wrap">
      <input type="tel" id="phone" placeholder="Enter 10 digit number" maxlength="10" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
    </div>
  </div>

  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="pass" placeholder="Enter your password">
      <button class="eye-btn" onclick="togglePass()" type="button">👁</button>
    </div>
    <div class="forgot-link"><a href="#" onclick="openForgot()">Forgot password?</a></div>
  </div>

  <button class="submit-btn" id="loginBtn" onclick="doLogin()">SIGN IN</button>

  <div class="divider"><span></span><p>OR</p><span></span></div>

  <div class="register-link">New user? <a href="/register">Create account →</a></div>

  <div class="powered">Powered by <span>CASHYFY ⚡</span></div>
</div>

<!-- Forgot Modal -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal">
    <div class="modal-title">Reset Password</div>
    <div class="modal-sub">Enter your phone number. A new password will be sent to your registered number.</div>
    <div class="field">
      <label>Phone Number</label>
      <div class="input-wrap">
        <input type="tel" id="forgotPhone" placeholder="Enter 10 digit number" maxlength="10" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
      </div>
    </div>
    <button class="modal-btn" id="forgotBtn" onclick="doForgot()">SEND NEW PASSWORD</button>
    <button class="modal-cancel" onclick="closeForgot()">Cancel</button>
  </div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon">✓</span>
  <span id="toastText"></span>
</div>

<script>
const SERVER = 'https://cashyfy-1.onrender.com';

// ✅ Already logged in check
window.addEventListener('load', () => {
  if (localStorage.getItem('cy_token')) {
    window.location.href = '/dashboard';
  }
});

function togglePass() {
  const input = document.getElementById('pass');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function openForgot() { document.getElementById('forgotModal').classList.add('open'); }
function closeForgot() { document.getElementById('forgotModal').classList.remove('open'); }

let toastTimer = null;
function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  document.getElementById('toastText').innerText = msg;
  icon.innerText = ok ? '✓' : '✕';
  icon.style.background = ok ? '#1c1c1c' : '#e53935';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function doLogin() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('pass').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.style.display = 'none';
  if (!/^[6-9]\d{9}$/.test(phone)) { errorMsg.innerText = 'Enter valid 10 digit phone number!'; errorMsg.style.display = 'block'; return; }
  if (!password) { errorMsg.innerText = 'Enter your password!'; errorMsg.style.display = 'block'; return; }

  btn.disabled = true;
  btn.innerText = 'Signing in...';

  try {
    const res = await fetch(`${SERVER}/web/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('cy_token', data.token);
      localStorage.setItem('cy_name', data.name);
      localStorage.setItem('cy_phone', data.phone);
      showToast('Welcome back! 🎉');
      setTimeout(() => window.location.href = '/dashboard', 800);
    } else {
      errorMsg.innerText = data.error || 'Login failed!';
      errorMsg.style.display = 'block';
    }
  } catch(e) {
    errorMsg.innerText = 'Server error. Try again!';
    errorMsg.style.display = 'block';
  }

  btn.disabled = false;
  btn.innerText = 'SIGN IN';
}

async function doForgot() {
  const phone = document.getElementById('forgotPhone').value.trim();
  const btn = document.getElementById('forgotBtn');
  if (!/^[6-9]\d{9}$/.test(phone)) { showToast('Enter valid phone number!', false); return; }
  btn.disabled = true;
  btn.innerText = 'Sending...';
  try {
    const res = await fetch(`${SERVER}/web/forgot`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    if (data.success) {
      closeForgot();
      showToast('New password sent! Check SMS & Telegram.');
    } else {
      showToast(data.error || 'Error!', false);
    }
  } catch(e) { showToast('Server error!', false); }
  btn.disabled = false;
  btn.innerText = 'SEND NEW PASSWORD';
}

document.getElementById('phone').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('pass').focus(); });
document.getElementById('pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
    </html>
