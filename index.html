
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
const S = atob('aHR0cHM6Ly9jYXNoeWZ5LTEub25yZW5kZXIuY29t');

// ✅ Offer map — jo name dalo URL mein wo file load hogi
const offerMap = {
  'Angl': 'offers/Angl.html',
  'PB': 'offers/PB.html',
  'WV': 'offers/WV.html',
  'BR': 'offers/BR.html',
  'JS': 'offers/JS.html',
  'FR': 'offers/FR.html',
  'IG': 'offers/IG.html',
  'ST': 'offers/ST.html'
};

// ✅ Refer code se offer name → slug map
const nameToSlug = {
  'Waves': 'WV',
  'PolicyBazar': 'PB',
  'Bharat Ryd': 'BR',
  'Jigri Super': 'JS',
  'FRIENDSHIP': 'FR',
  'Incred Gold': 'IG',
  'StoryTv Fire': 'ST'
};

const parts = window.location.pathname.split('/').filter(Boolean);
const section = parts[0];
const slug = decodeURIComponent(parts[1] || '');
const source = new URLSearchParams(window.location.search).get('source') || null;

function loadFile(file) {
  fetch('/' + file)
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(html => { document.open(); document.write(html); document.close(); })
    .catch(() => showPaused());
}

function showPaused() {
  document.body.innerHTML = '<h2 style="text-align:center;margin-top:40px;font-family:sans-serif;">Offer Temporarily Paused</h2>';
}

if (section === 'offer') {
  if (slug && offerMap[slug]) {
    loadFile(offerMap[slug]);
  } else {
    showPaused();
  }
} else if (section === 'refer') {
  loadFile('refer.html');
} else if (section === 'tracker') {
  loadFile('tracker.html');
} else {
  showPaused();
}
</script>
</body>
</html>
