<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashyfy — Profile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{--cream:#F6F1E9;--cream-dim:#EDE6D8;--ink:#161412;--ink-soft:#3A362F;--gold:#B9975B;--line:#D9D0BE;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{font-family:'Inter',sans-serif;background:var(--cream-dim);min-height:100vh;}
.app-shell{width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:var(--cream-dim);}
.dash-header{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.back-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.back-btn svg{stroke:var(--ink);}
.dash-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--ink);margin:0;}
.content{padding:20px 18px 40px;}
.profile-hero{background:linear-gradient(135deg,#1E1B17 0%,#3A2E1D 55%,#5C4425 100%);border-radius:20px;padding:28px 24px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
.profile-hero::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid rgba(185,151,91,0.15);border-radius:50%;}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 12px;}
.profile-name{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--cream);margin:0 0 4px;}
.profile-phone{font-size:13px;color:rgba(246,241,233,0.6);}
.section{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:14px;}
.section-head{padding:16px 20px;border-bottom:1px solid var(--line);font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--ink);}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);}
.info-row:last-child{border-bottom:none;}
.info-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#A9A28E;}
.info-val{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);}
.form-field{padding:14px 20px;border-bottom:1px solid var(--line);}
.form-field:last-of-type{border-bottom:none;}
.form-field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#A9A28E;margin-bottom:8px;}
.form-field .input-wrap{display:flex;align-items:center;background:var(--cream-dim);border:1px solid var(--line);border-radius:10px;padding:0 12px;}
.form-field .input-wrap:focus-within{border-color:var(--gold);}
.form-field .input-wrap svg{flex-shrink:0;stroke:#A9A28E;}
.form-field .input-wrap input{border:0;outline:0;background:transparent;width:100%;padding:12px 10px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);}
.section-btn{width:calc(100% - 40px);margin:16px 20px;border:0;border-radius:10px;padding:13px;background:var(--ink);color:var(--cream);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.section-btn:hover{background:#000;}
.section-btn:disabled{opacity:0.5;cursor:not-allowed;}
.danger-btn{background:transparent;color:#C25454;border:1px solid #F3C7C7;padding:13px;border-radius:10px;width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;}
.danger-btn:hover{background:#FEF2F2;}
.toggle-eye{cursor:pointer;stroke:#A9A28E;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:calc(100% - 40px);max-width:380px;background:#fff;border:1px solid #CDEBD9;border-radius:14px;padding:14px 16px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:60;}
.toast.show{display:flex;}
.toast svg.check{stroke:#3CA870;flex-shrink:0;}
.toast.error{border-color:#F3C7C7;}
.toast.error svg.check{stroke:#C25454;}
.toast span{flex:1;font-size:14px;color:var(--ink);font-weight:500;}
.toast.error span{color:#C25454;}
.toast-close{cursor:pointer;stroke:#A9A28E;}
</style>
</head>
<body>
<div class="app-shell">
<div class="dash-header">
  <div class="back-btn" onclick="window.location.href='/dashboard'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </div>
  <h1 class="dash-title">Profile</h1>
</div>
<div class="content">
  <div class="profile-hero">
    <div class="profile-avatar" id="profileAvatar">H</div>
    <div class="profile-name" id="profileName">—</div>
    <div class="profile-phone" id="profilePhone">—</div>
  </div>

  <!-- Account Info -->
  <div class="section">
    <div class="section-head">Account</div>
    <div class="info-row"><span class="info-label">Balance</span><span class="info-val" id="infoBalance">₹0.00</span></div>
    <div class="info-row"><span class="info-label">Lifetime Earnings</span><span class="info-val" id="infoLifetime">₹0.00</span></div>
    <div class="info-row"><span class="info-label">Phone</span><span class="info-val" id="infoPhone">—</span></div>
  </div>

  <!-- Change Password -->
  <div class="section">
    <div class="section-head">Change Password</div>
    <div class="form-field">
      <label>Current Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="curPass" placeholder="Current password">
        <svg class="toggle-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="toggleF('curPass')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
    <div class="form-field">
      <label>New Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="newPass" placeholder="New password">
        <svg class="toggle-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="toggleF('newPass')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
    <div class="form-field">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="confirmPass" placeholder="Confirm password">
        <svg class="toggle-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="toggleF('confirmPass')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
    <button class="section-btn" id="changePassBtn" onclick="changePassword()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Update Password
    </button>
  </div>

  <!-- Logout -->
  <div class="section" style="padding:16px 20px;">
    <button class="danger-btn" onclick="doLogout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </div>
</div>
</div>

<div class="toast" id="toast">
  <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastText"></span>
  <svg class="toast-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="hideToast()"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</div>

<script>
const SERVER = 'https://cashyfy-1.onrender.com';

window.addEventListener('load', async () => {
  const token = localStorage.getItem('cy_token');
  if (!token) { window.location.href = '/login'; return; }
  await loadProfile(token);
});

let toastTimer = null;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  document.getElementById('toastText').innerText = msg;
  t.className = 'toast show' + (type==='error'?' error':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

function toggleF(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}

async function loadProfile(token) {
  try {
    const res = await fetch(`${SERVER}/web/profile`, { headers: {'x-token': token} });
    const data = await res.json();
    if (!data.success) { localStorage.clear(); window.location.href = '/login'; return; }
    const firstName = data.name.split(' ')[0];
    document.getElementById('profileAvatar').textContent = firstName.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = data.name;
    document.getElementById('profilePhone').textContent = data.phone;
    document.getElementById('infoBalance').textContent = '₹' + data.balance;
    document.getElementById('infoLifetime').textContent = '₹' + data.lifetime_earnings;
    document.getElementById('infoPhone').textContent = data.phone;
  } catch(e) {}
}

async function changePassword() {
  const cur = document.getElementById('curPass').value;
  const next = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const btn = document.getElementById('changePassBtn');
  if (!cur) { showToast('Enter current password!', 'error'); return; }
  if (next.length < 6) { showToast('New password too short!', 'error'); return; }
  if (next !== confirm) { showToast('Passwords do not match!', 'error'); return; }
  btn.disabled = true; btn.innerText = 'Updating...';
  try {
    const res = await fetch(`${SERVER}/web/update-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': localStorage.getItem('cy_token') },
      body: JSON.stringify({ current_password: cur, new_password: next })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('curPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
      showToast('Password updated! ✅');
    } else { showToast(data.error || 'Error!', 'error'); }
  } catch(e) { showToast('Server error!', 'error'); }
  btn.disabled = false;
  btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Update Password';
}

async function doLogout() {
  try { await fetch(`${SERVER}/web/logout`, { method:'POST', headers:{'x-token':localStorage.getItem('cy_token')} }); } catch(e) {}
  localStorage.clear();
  window.location.href = '/login';
}
</script>
</body>
</html>
