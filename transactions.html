<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashyfy — Transactions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{--cream:#F6F1E9;--cream-dim:#EDE6D8;--ink:#161412;--ink-soft:#3A362F;--gold:#B9975B;--line:#D9D0BE;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;}
body{font-family:'Inter',sans-serif;background:var(--cream-dim);min-height:100vh;}
.app-shell{width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:var(--cream-dim);}
.dash-header{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.back-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.back-btn svg{stroke:var(--ink);}
.dash-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--ink);margin:0;}
.content{padding:20px 18px 40px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line);}
.stat-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#A9A28E;margin-bottom:6px;}
.stat-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--ink);}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-family:'Inter',sans-serif;flex-shrink:0;}
.filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.search-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:16px;}
.search-wrap:focus-within{border-color:var(--gold);}
.search-wrap svg{flex-shrink:0;stroke:#A9A28E;}
.search-wrap input{border:0;outline:0;background:transparent;width:100%;padding:12px 8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);}
.search-wrap input::placeholder{color:#A9A28E;}
.txn-list{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;}
.txn-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
.txn-row:last-child{border-bottom:none;}
.txn-row:hover{background:var(--cream-dim);}
.txn-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.txn-icon.in{background:#ECFDF5;}
.txn-icon.in svg{stroke:#3CA870;}
.txn-icon.out{background:#FEF2F2;}
.txn-icon.out svg{stroke:#C25454;}
.txn-mid{flex:1;min-width:0;}
.txn-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-sub{font-size:12px;color:#A9A28E;margin-top:2px;}
.txn-right{text-align:right;flex-shrink:0;}
.txn-amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
.txn-amt.in{color:#3CA870;}
.txn-amt.out{color:#C25454;}
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;margin-top:4px;}
.status-pill.success{background:#ECFDF5;color:#3CA870;}
.status-pill.pending{background:#FFFBEB;color:#D97706;}
.status-pill.failed{background:#FEF2F2;color:#C25454;}
.empty-state{padding:40px 20px;text-align:center;color:#A9A28E;}
.empty-state p{font-size:14px;margin-top:8px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:calc(100% - 40px);max-width:380px;background:#fff;border:1px solid #CDEBD9;border-radius:14px;padding:14px 16px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:60;}
.toast.show{display:flex;}
.toast svg.check{stroke:#3CA870;flex-shrink:0;}
.toast span{flex:1;font-size:14px;color:var(--ink);}
.toast-close{cursor:pointer;stroke:#A9A28E;}
</style>
</head>
<body>
<div class="app-shell">
<div class="dash-header">
  <div class="back-btn" onclick="window.location.href='/dashboard'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </div>
  <h1 class="dash-title">Transactions</h1>
</div>
<div class="content">
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-eyebrow">Total Credit</div><div class="stat-value" id="totalCredit">₹0.00</div></div>
    <div class="stat-card"><div class="stat-eyebrow">Total Debit</div><div class="stat-value" id="totalDebit">₹0.00</div></div>
  </div>
  <div class="filter-scroll">
    <button class="filter-chip active" id="f_all" onclick="setFilter('all')">All</button>
    <button class="filter-chip" id="f_credit" onclick="setFilter('credit')">↑ Credit</button>
    <button class="filter-chip" id="f_debit" onclick="setFilter('debit')">↓ Debit</button>
    <button class="filter-chip" id="f_success" onclick="setFilter('success')">✅ Success</button>
    <button class="filter-chip" id="f_pending" onclick="setFilter('pending')">⏳ Pending</button>
    <button class="filter-chip" id="f_failed" onclick="setFilter('failed')">❌ Failed</button>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search transactions..." oninput="renderTxns()">
  </div>
  <div class="txn-list" id="txnList">
    <div class="empty-state"><p>Loading...</p></div>
  </div>
</div>
</div>
<div class="toast" id="toast">
  <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastText"></span>
  <svg class="toast-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="hideToast()"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</div>
<script>
const SERVER = 'https://cashyfy-1.onrender.com';
let allTxns = [];
let currentFilter = 'all';

window.addEventListener('load', async () => {
  const token = localStorage.getItem('cy_token');
  if (!token) { window.location.href = '/login'; return; }
  await loadTxns(token);
});

async function loadTxns(token) {
  try {
    const res = await fetch(`${SERVER}/web/txns`, { headers: {'x-token': token} });
    const data = await res.json();
    if (data.success) {
      allTxns = data.txns;
      updateStats();
      renderTxns();
    }
  } catch(e) {}
}

function updateStats() {
  const credit = allTxns.filter(t=>t.type==='credit').reduce((s,t)=>s+t.amount,0);
  const debit = allTxns.filter(t=>t.type==='debit').reduce((s,t)=>s+t.amount,0);
  document.getElementById('totalCredit').textContent = '₹'+credit.toFixed(2);
  document.getElementById('totalDebit').textContent = '₹'+debit.toFixed(2);
}

function setFilter(f) {
  currentFilter = f;
  ['all','credit','debit','success','pending','failed'].forEach(x => {
    document.getElementById(`f_${x}`)?.classList.toggle('active', x===f);
  });
  renderTxns();
}

function statusIconSvg(status) {
  if(status==='success') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><polyline points="20 6 9 17 4 12"/></svg>';
  if(status==='pending') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
}

function renderTxns() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allTxns;
  if (currentFilter === 'credit') filtered = filtered.filter(t=>t.type==='credit');
  else if (currentFilter === 'debit') filtered = filtered.filter(t=>t.type==='debit');
  else if (['success','pending','failed'].includes(currentFilter)) filtered = filtered.filter(t=>t.status===currentFilter);
  if (search) filtered = filtered.filter(t=>t.title.toLowerCase().includes(search)||t.date.toLowerCase().includes(search));
  const list = document.getElementById('txnList');
  if (filtered.length === 0) { list.innerHTML = '<div class="empty-state"><p>No transactions found</p></div>'; return; }
  list.innerHTML = filtered.map(t => `
    <div class="txn-row">
      <div class="txn-icon ${t.type==='credit'?'in':'out'}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${t.type==='credit'?'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>':'<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>'}
        </svg>
      </div>
      <div class="txn-mid">
        <div class="txn-title">${t.title}</div>
        <div class="txn-sub">${t.date}</div>
      </div>
      <div class="txn-right">
        <div class="txn-amt ${t.type==='credit'?'in':'out'}">${t.type==='credit'?'+':'-'}₹${t.amount.toFixed(2)}</div>
        <span class="status-pill ${t.status}">${statusIconSvg(t.status)} ${t.status.charAt(0).toUpperCase()+t.status.slice(1)}</span>
      </div>
    </div>`).join('');
}

let toastTimer = null;
function showToast(msg) { const t=document.getElementById('toast'); document.getElementById('toastText').innerText=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,3000); }
function hideToast() { document.getElementById('toast').classList.remove('show'); }
</script>
</body>
</html>
