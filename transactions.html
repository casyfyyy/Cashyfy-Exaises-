<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions - CashyFy Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f7f1e3; min-height:100vh; }
.topbar { background:#fffdf7; padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #ece3cc; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; }
.topbar-title { font-family:'Poppins',sans-serif; font-size:18px; font-weight:800; color:#1a1a1a; }
.content { padding:20px; max-width:480px; margin:0 auto; }
.filter-wrap { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
.filter-wrap::-webkit-scrollbar { display:none; }
.filter-btn { padding:8px 16px; border-radius:50px; border:2px solid #ece3cc; background:#fffdf7; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; color:#9a9184; font-family:'Inter',sans-serif; }
.filter-btn.active { background:#1c1c1c; color:#fdf6e3; border-color:#1c1c1c; }
.search-input { width:100%; padding:12px 16px; border:2px solid #ece3cc; border-radius:14px; font-size:14px; font-family:'Inter',sans-serif; font-weight:600; color:#1a1a1a; outline:none; background:#fffdf7; margin-bottom:16px; }
.search-input:focus { border-color:#1c1c1c; }
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.stat-item { background:#fffdf7; border-radius:14px; padding:14px 16px; border:1px solid #ece3cc; }
.stat-label { font-size:11px; color:#9a9184; font-weight:600; text-transform:uppercase; }
.stat-val { font-size:18px; font-weight:800; color:#1a1a1a; margin-top:4px; }
.stat-val.green { color:#22c55e; }
.stat-val.red { color:#e53935; }
.txn-item { background:#fffdf7; border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px; border:1px solid #ece3cc; }
.txn-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.txn-icon.credit { background:#f0fff4; }
.txn-icon.debit { background:#fff0f0; }
.txn-mid { flex:1; }
.txn-title { font-size:14px; font-weight:700; color:#1a1a1a; }
.txn-date { font-size:12px; color:#9a9184; margin-top:2px; }
.txn-amt { font-size:15px; font-weight:800; }
.txn-amt.credit { color:#22c55e; }
.txn-amt.debit { color:#e53935; }
.txn-status { font-size:11px; font-weight:600; margin-top:2px; text-align:right; }
.empty-state { text-align:center; padding:60px 20px; color:#9a9184; }
.empty-state p { font-size:14px; font-weight:600; margin-top:8px; }
.toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-16px); background:#fffdf7; color:#1a1a1a; padding:12px 22px 12px 12px; border-radius:50px; font-size:14px; font-weight:800; z-index:10000; opacity:0; visibility:hidden; transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 12px 30px -6px rgba(0,0,0,0.2); font-family:'Inter',sans-serif; display:flex; align-items:center; gap:10px; white-space:nowrap; border:1px solid #ece3cc; }
.toast.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
.toast-icon { width:24px; height:24px; border-radius:50%; background:#1c1c1c; color:#fdf6e3; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='/dashboard'">←</button>
  <div class="topbar-title">Transactions</div>
</div>

<div class="content">
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-label">Total Credit</div>
      <div class="stat-val green" id="totalCredit">₹0.00</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Total Debit</div>
      <div class="stat-val red" id="totalDebit">₹0.00</div>
    </div>
  </div>

  <div class="filter-wrap">
    <button class="filter-btn active" id="f_all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" id="f_credit" onclick="setFilter('credit')">↑ Credit</button>
    <button class="filter-btn" id="f_debit" onclick="setFilter('debit')">↓ Debit</button>
    <button class="filter-btn" id="f_success" onclick="setFilter('success')">✅ Success</button>
    <button class="filter-btn" id="f_pending" onclick="setFilter('pending')">⏳ Pending</button>
  </div>

  <input class="search-input" id="searchInput" placeholder="Search transactions..." oninput="renderTxns()">

  <div id="txnList"><div class="empty-state">⏳<p>Loading...</p></div></div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon">✓</span>
  <span id="toastText"></span>
</div>

<script>
const SERVER = 'https://cashyfy-1.onrender.com';
let allTxns = [];
let currentFilter = 'all';

window.addEventListener('load', async () => {
  const token = localStorage.getItem('cy_token');
  if (!token) { window.location.href = '/login'; return; }
  await loadTxns();
});

async function loadTxns() {
  try {
    const res = await fetch(`${SERVER}/web/txns`, { headers:{'x-token': localStorage.getItem('cy_token')} });
    const data = await res.json();
    if (data.success) {
      allTxns = data.txns;
      updateStats();
      renderTxns();
    }
  } catch(e) {}
}

function updateStats() {
  const credit = allTxns.filter(t => t.type === 'credit').reduce((s,t) => s+t.amount, 0);
  const debit = allTxns.filter(t => t.type === 'debit').reduce((s,t) => s+t.amount, 0);
  document.getElementById('totalCredit').innerText = '₹' + credit.toFixed(2);
  document.getElementById('totalDebit').innerText = '₹' + debit.toFixed(2);
}

function setFilter(filter) {
  currentFilter = filter;
  ['all','credit','debit','success','pending'].forEach(f => {
    document.getElementById(`f_${f}`)?.classList.toggle('active', f === filter);
  });
  renderTxns();
}

function renderTxns() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allTxns;
  if (currentFilter === 'credit') filtered = filtered.filter(t => t.type === 'credit');
  else if (currentFilter === 'debit') filtered = filtered.filter(t => t.type === 'debit');
  else if (currentFilter === 'success') filtered = filtered.filter(t => t.status === 'success');
  else if (currentFilter === 'pending') filtered = filtered.filter(t => t.status === 'pending');
  if (search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search) || t.date.toLowerCase().includes(search));

  const list = document.getElementById('txnList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">📭<p>No transactions found</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(t => `
    <div class="txn-item">
      <div class="txn-icon ${t.type}">${t.type === 'credit' ? '⬆️' : '⬇️'}</div>
      <div class="txn-mid">
        <div class="txn-title">${t.title}</div>
        <div class="txn-date">${t.date}</div>
      </div>
      <div style="text-align:right;">
        <div class="txn-amt ${t.type}">${t.type === 'credit' ? '+' : '-'}₹${t.amount.toFixed(2)}</div>
        <div class="txn-status" style="color:${t.status==='success'?'#22c55e':t.status==='pending'?'#f59e0b':'#e53935'}">${t.status}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
