<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CashyFy Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f7f1e3; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card { background:#fffdf7; border-radius:28px; padding:36px 28px; max-width:400px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,0.12); border-top:4px solid #1c1c1c; }
.logo-wrap { display:flex; justify-content:center; margin-bottom:24px; }
.logo-outer { width:72px; height:72px; border-radius:50%; background:#f0e4c4; display:flex; align-items:center; justify-content:center; }
.logo-inner { width:52px; height:52px; border-radius:14px; overflow:hidden; }
.logo-inner img { width:100%; height:100%; object-fit:cover; }
.title { font-family:'Poppins',sans-serif; font-size:24px; font-weight:800; color:#1a1a1a; text-align:center; margin-bottom:6px; }
.subtitle { font-size:14px; color:#9a9184; text-align:center; margin-bottom:28px; }
.step-indicator { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:28px; }
.step-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; border:2px solid #ece3cc; color:#9a9184; }
.step-dot.active { background:#1c1c1c; color:#fdf6e3; border-color:#1c1c1c; }
.step-dot.done { background:#22c55e; color:#fff; border-color:#22c55e; }
.step-line { flex:1; max-width:40px; height:2px; background:#ece3cc; }
.step-line.done { background:#22c55e; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13px; font-weight:700; color:#1a1a1a; margin-bottom:8px; }
.input-wrap { position:relative; }
.input-wrap input { width:100%; padding:14px 18px; border:2px solid #ece3cc; border-radius:14px; font-size:15px; font-family:'Inter',sans-serif; font-weight:600; color:#1a1a1a; outline:none; background:#fbf7ec; transition:border-color 0.2s; }
.input-wrap input:focus { border-color:#1c1c1c; background:#fff; }
.input-wrap input::placeholder { color:#bbb; font-weight:500; }
.eye-btn { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9a9184; font-size:16px; }
.submit-btn { width:100%; padding:16px; background:linear-gradient(135deg,#1c1c1c,#3a3a3a); color:#fdf6e3; border:none; border-radius:14px; font-size:16px; font-weight:800; font-family:'Poppins',sans-serif; cursor:pointer; letter-spacing:1px; transition:all 0.2s; box-shadow:0 4px 16px rgba(0,0,0,0.3); margin-top:8px; }
.submit-btn:hover { transform:translateY(-2px); }
.submit-btn:disabled { opacity:0.7; cursor:not-allowed; transform:none; }
.back-btn { width:100%; padding:14px; background:transparent; color:#1a1a1a; border:2px solid #ece3cc; border-radius:14px; font-size:15px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; margin-top:8px; }
.error-msg { background:#fff0f0; border:1px solid #ffcccc; border-radius:10px; padding:10px 14px; font-size:13px; color:#e53935; font-weight:600; margin-bottom:16px; display:none; }
.success-msg { background:#f0fff4; border:1px solid #bbf7d0; border-radius:10px; padding:10px 14px; font-size:13px; color:#16a34a; font-weight:600; margin-bottom:16px; display:none; }
.login-link { text-align:center; font-size:14px; color:#9a9184; margin-top:16px; }
.login-link a { color:#1c1c1c; font-weight:800; text-decoration:none; border-bottom:1px solid #1c1c1c; }
.powered { text-align:center; margin-top:20px; font-size:12px; color:#bbb; font-weight:700; }
.powered span { color:#1c1c1c; }
.otp-inputs { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
.otp-input { width:48px; height:56px; border:2px solid #ece3cc; border-radius:12px; font-size:22px; font-weight:800; text-align:center; outline:none; background:#fbf7ec; color:#1a1a1a; font-family:'Inter',sans-serif; }
.otp-input:focus { border-color:#1c1c1c; background:#fff; }
.resend-wrap { text-align:center; margin-bottom:16px; }
.resend-btn { background:none; border:none; font-size:13px; font-weight:700; color:#9a9184; cursor:pointer; font-family:'Inter',sans-serif; }
.resend-btn.active { color:#1c1c1c; text-decoration:underline; }
.timer { font-size:13px; color:#9a9184; font-weight:600; }
.strength-bar { display:flex; gap:4px; margin-top:8px; }
.s-bar { flex:1; height:4px; border-radius:2px; background:#ece3cc; transition:background 0.3s; }
.strength-label { font-size:12px; font-weight:600; color:#9a9184; margin-top:4px; }
.toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-16px); background:#fffdf7; color:#1a1a1a; padding:12px 22px 12px 12px; border-radius:50px; font-size:14px; font-weight:800; z-index:10000; opacity:0; visibility:hidden; transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 12px 30px -6px rgba(0,0,0,0.2); font-family:'Inter',sans-serif; display:flex; align-items:center; gap:10px; white-space:nowrap; border:1px solid #ece3cc; }
.toast.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
.toast-icon { width:24px; height:24px; border-radius:50%; background:#1c1c1c; color:#fdf6e3; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-outer">
      <div class="logo-inner">
        <img src="https://i.ibb.co/gZFrdcN9/istockphoto-1412043856-1024x1024.jpg">
      </div>
    </div>
  </div>
  <div class="title">Create Account ⚡</div>
  <div class="subtitle">Join CashyFy Wallet today</div>

  <div class="step-indicator">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
    <div class="step-line" id="line2"></div>
    <div class="step-dot" id="dot3">3</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <!-- Step 1: Phone -->
  <div id="step1">
    <div class="field">
      <label>Phone Number</label>
      <div class="input-wrap">
        <input type="tel" id="regPhone" placeholder="Enter 10 digit number" maxlength="10" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
      </div>
    </div>
    <button class="submit-btn" id="sendOtpBtn" onclick="sendOtp()">SEND OTP</button>
    <div class="login-link">Already registered? <a href="/login">Sign in →</a></div>
  </div>

  <!-- Step 2: OTP -->
  <div id="step2" style="display:none;">
    <p style="font-size:14px;color:#9a9184;text-align:center;margin-bottom:20px;">Enter OTP sent to your phone</p>
    <div class="otp-inputs">
      <input class="otp-input" id="otp1" maxlength="1" inputmode="numeric" oninput="otpNext(this,'otp2')" onkeydown="otpBack(event,this,'')">
      <input class="otp-input" id="otp2" maxlength="1" inputmode="numeric" oninput="otpNext(this,'otp3')" onkeydown="otpBack(event,this,'otp1')">
      <input class="otp-input" id="otp3" maxlength="1" inputmode="numeric" oninput="otpNext(this,'otp4')" onkeydown="otpBack(event,this,'otp2')">
      <input class="otp-input" id="otp4" maxlength="1" inputmode="numeric" oninput="otpNext(this,'otp5')" onkeydown="otpBack(event,this,'otp3')">
      <input class="otp-input" id="otp5" maxlength="1" inputmode="numeric" oninput="otpNext(this,'otp6')" onkeydown="otpBack(event,this,'otp4')">
      <input class="otp-input" id="otp6" maxlength="1" inputmode="numeric" oninput="otpNext(this,'')" onkeydown="otpBack(event,this,'otp5')">
    </div>
    <div class="resend-wrap">
      <span class="timer" id="otpTimer">Resend in 2:00</span>
      <button class="resend-btn" id="resendBtn" style="display:none;" onclick="resendOtp()">Resend OTP</button>
    </div>
    <button class="submit-btn" id="verifyOtpBtn" onclick="verifyOtp()">VERIFY OTP</button>
    <button class="back-btn" onclick="goStep(1)">Back</button>
  </div>

  <!-- Step 3: Password -->
  <div id="step3" style="display:none;">
    <div class="field">
      <label>Create Password</label>
      <div class="input-wrap">
        <input type="password" id="newPass" placeholder="Create a strong password" oninput="checkStrength()">
        <button class="eye-btn" onclick="togglePass('newPass')" type="button">👁</button>
      </div>
      <div class="strength-bar">
        <div class="s-bar" id="b1"></div>
        <div class="s-bar" id="b2"></div>
        <div class="s-bar" id="b3"></div>
        <div class="s-bar" id="b4"></div>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPass" placeholder="Re-enter password" oninput="checkMatch()">
        <button class="eye-btn" onclick="togglePass('confirmPass')" type="button">👁</button>
      </div>
    </div>
    <button class="submit-btn" id="createBtn" onclick="createAccount()">CREATE ACCOUNT</button>
    <button class="back-btn" onclick="goStep(2)">Back</button>
  </div>

  <div class="powered">Powered by <span>CASHYFY ⚡</span></div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon">✓</span>
  <span id="toastText"></span>
</div>

<script>
const SERVER = 'https://cashyfy-1.onrender.com';
let otpTimerInterval = null;
let regPhone = '';

window.addEventListener('load', () => {
  if (localStorage.getItem('cy_token')) window.location.href = '/dashboard';
});

function goStep(n) {
  [1,2,3].forEach(i => document.getElementById(`step${i}`).style.display = i === n ? 'block' : 'none');
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
  [1,2,3].forEach(i => {
    const dot = document.getElementById(`dot${i}`);
    dot.classList.remove('active','done');
    if (i < n) dot.classList.add('done');
    else if (i === n) dot.classList.add('active');
  });
  [1,2].forEach(i => {
    const line = document.getElementById(`line${i}`);
    line.classList.toggle('done', i < n);
  });
}

let toastTimer = null;
function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').innerText = msg;
  document.getElementById('toastIcon').innerText = ok ? '✓' : '✕';
  document.getElementById('toastIcon').style.background = ok ? '#1c1c1c' : '#e53935';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.innerText = msg;
  el.style.display = 'block';
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.innerText = msg;
  el.style.display = 'block';
}

async function sendOtp() {
  const phone = document.getElementById('regPhone').value.trim();
  const btn = document.getElementById('sendOtpBtn');
  document.getElementById('errorMsg').style.display = 'none';
  if (!/^[6-9]\d{9}$/.test(phone)) { showError('Enter valid 10 digit phone number!'); return; }
  regPhone = phone;
  btn.disabled = true;
  btn.innerText = 'Sending OTP...';
  try {
    const res = await fetch(`${SERVER}/web/send-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    if (data.success) {
      goStep(2);
      startOtpTimer();
      showToast('OTP sent to your phone!');
    } else {
      showError(data.error || 'Error sending OTP!');
    }
  } catch(e) { showError('Server error!'); }
  btn.disabled = false;
  btn.innerText = 'SEND OTP';
}

function startOtpTimer() {
  let secs = 120;
  clearInterval(otpTimerInterval);
  document.getElementById('otpTimer').style.display = 'inline';
  document.getElementById('resendBtn').style.display = 'none';
  otpTimerInterval = setInterval(() => {
    secs--;
    const m = Math.floor(secs/60);
    const s = String(secs%60).padStart(2,'0');
    document.getElementById('otpTimer').innerText = `Resend in ${m}:${s}`;
    if (secs <= 0) {
      clearInterval(otpTimerInterval);
      document.getElementById('otpTimer').style.display = 'none';
      document.getElementById('resendBtn').style.display = 'inline';
    }
  }, 1000);
}

async function resendOtp() {
  await sendOtp();
}

function otpNext(el, nextId) {
  el.value = el.value.replace(/\D/g,'');
  if (el.value && nextId) document.getElementById(nextId)?.focus();
}

function otpBack(e, el, prevId) {
  if (e.key === 'Backspace' && !el.value && prevId) document.getElementById(prevId)?.focus();
}

async function verifyOtp() {
  const otp = ['otp1','otp2','otp3','otp4','otp5','otp6'].map(id => document.getElementById(id).value).join('');
  const btn = document.getElementById('verifyOtpBtn');
  document.getElementById('errorMsg').style.display = 'none';
  if (otp.length !== 6) { showError('Enter complete 6 digit OTP!'); return; }
  btn.disabled = true;
  btn.innerText = 'Verifying...';
  try {
    const res = await fetch(`${SERVER}/web/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: regPhone, otp })
    });
    const data = await res.json();
    if (data.success) {
      clearInterval(otpTimerInterval);
      goStep(3);
      showToast('OTP verified! ✅');
    } else {
      showError(data.error || 'Invalid OTP!');
    }
  } catch(e) { showError('Server error!'); }
  btn.disabled = false;
  btn.innerText = 'VERIFY OTP';
}

function togglePass(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function checkStrength() {
  const val = document.getElementById('newPass').value;
  const checks = [val.length>=8, /[0-9]/.test(val), /[A-Z]/.test(val), /[^A-Za-z0-9]/.test(val)];
  const score = checks.filter(Boolean).length;
  const colors = ['#ef4444','#f59e0b','#eab308','#22c55e'];
  const labels = ['Weak','Fair','Good','Strong'];
  [1,2,3,4].forEach(i => {
    const bar = document.getElementById(`b${i}`);
    bar.style.background = i <= score ? colors[score-1] : '#ece3cc';
  });
  document.getElementById('strengthLabel').innerText = val.length > 0 ? labels[score-1] || '' : '';
  document.getElementById('strengthLabel').style.color = score > 0 ? colors[score-1] : '#9a9184';
}

function checkMatch() {
  const pass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const input = document.getElementById('confirmPass');
  if (confirm.length > 0) {
    input.style.borderColor = pass === confirm ? '#22c55e' : '#ef4444';
  }
}

async function createAccount() {
  const password = document.getElementById('newPass').value;
  const confirmPassword = document.getElementById('confirmPass').value;
  const btn = document.getElementById('createBtn');
  document.getElementById('errorMsg').style.display = 'none';
  if (password.length < 6) { showError('Password too short! Minimum 6 characters.'); return; }
  if (password !== confirmPassword) { showError('Passwords do not match!'); return; }
  btn.disabled = true;
  btn.innerText = 'Creating...';
  try {
    const res = await fetch(`${SERVER}/web/set-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: regPhone, password })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Account created! 🎉');
      setTimeout(() => window.location.href = '/login', 1200);
    } else {
      showError(data.error || 'Error!');
    }
  } catch(e) { showError('Server error!'); }
  btn.disabled = false;
  btn.innerText = 'CREATE ACCOUNT';
}
</script>
</body>
  </html>
